<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GET THE RANCH</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
    <style>
        /* ---------- RESET & BASE ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        :root {
            --bg-primary: #0b0b0b;
            --bg-secondary: #161616;
            --bg-card: #1e1e1e;
            --bg-input: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #6b6b6b;
            --accent: #f85a3e;
            --accent-hover: #ff6f55;
            --border-color: #333333;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.25s ease;
        }

        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 40px;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ---------- NAVBAR ---------- */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 11, 11, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px 16px;
        }

        .navbar-brand {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: color var(--transition);
        }

        .navbar-brand:hover {
            color: var(--accent);
        }

        .navbar-search {
            display: flex;
            align-items: center;
            gap: 0;
            flex: 1 1 320px;
            max-width: 480px;
            min-width: 180px;
        }

        .navbar-search input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-right: none;
            border-radius: var(--radius-sm) 0 0 var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            min-width: 0;
        }

        .navbar-search input::placeholder {
            color: var(--text-muted);
        }

        .navbar-search input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(248, 90, 62, 0.2);
        }

        .navbar-search button {
            padding: 10px 18px;
            border: 1px solid var(--accent);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            background: var(--accent);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background var(--transition), transform 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .navbar-search button:hover {
            background: var(--accent-hover);
        }

        .navbar-search button:active {
            transform: scale(0.96);
        }

        .navbar-search button svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* ---------- MAIN CONTAINER ---------- */
        .main-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 24px 0;
        }

        /* ---------- HERO BANNER ---------- */
        .hero-banner {
            position: relative;
            width: 90%;
            margin: 0 auto 32px;
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 16 / 9;
            max-height: 560px;
            background: var(--bg-secondary);
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .hero-banner:hover {
            transform: scale(1.004);
            box-shadow: 0 12px 44px rgba(0, 0, 0, 0.8);
        }

        .hero-banner .hero-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            background: var(--bg-secondary);
        }

        .hero-banner .hero-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 32px 40px;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.1) 80%);
            transition: background 0.3s;
            pointer-events: none;
        }

        .hero-banner .hero-overlay .hero-title {
            font-size: clamp(1.4rem, 4vw, 2.8rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 6px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }

        .hero-banner .hero-overlay .hero-meta {
            font-size: clamp(0.85rem, 1.2vw, 1.05rem);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
        }

        .hero-banner .hero-overlay .hero-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .hero-banner .hero-overlay .hero-play-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 32px;
            border: none;
            border-radius: 40px;
            background: var(--accent);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background var(--transition), transform 0.15s;
            align-self: flex-start;
            box-shadow: 0 4px 20px rgba(248, 90, 62, 0.35);
            letter-spacing: 0.02em;
            pointer-events: auto;
        }

        .hero-banner .hero-overlay .hero-play-btn:hover {
            background: var(--accent-hover);
        }

        .hero-banner .hero-overlay .hero-play-btn:active {
            transform: scale(0.96);
        }

        .hero-banner .hero-overlay .hero-play-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .hero-banner .hero-loading {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .hero-banner .hero-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .hero-banner .hero-loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hero-banner.hidden {
            display: none !important;
        }

        /* ---------- SKELETON LOADING ---------- */
        .skeleton-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .skeleton-card .skeleton-img {
            aspect-ratio: 16 / 9;
            background: #2a2a2a;
        }

        .skeleton-card .skeleton-text {
            height: 16px;
            background: #2a2a2a;
            margin: 12px 14px 8px;
            border-radius: 4px;
        }

        .skeleton-card .skeleton-text.short {
            width: 60%;
            margin-top: 0;
            margin-bottom: 14px;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* ---------- SECTION TITLE ---------- */
        .section-title {
            font-size: clamp(1.3rem, 2.2vw, 2rem);
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title .title-query {
            color: var(--accent);
            font-weight: 600;
        }

        /* ---------- VIDEO GRID ---------- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 16px;
        }

        .video-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border-color: var(--accent);
        }

        .video-card .card-img-wrap {
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: var(--bg-secondary);
            flex-shrink: 0;
        }

        .video-card .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .video-card:hover .card-img-wrap img {
            transform: scale(1.03);
        }

        .video-card .card-body {
            padding: 12px 14px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .video-card .card-body .card-title {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-primary);
        }

        .video-card .card-body .card-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: auto;
            padding-top: 6px;
        }

        .video-card .card-body .card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .video-card .card-body .card-author {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .no-results span {
            display: block;
            font-size: 3rem;
            margin-bottom: 12px;
        }

        /* ---------- PREVIEW VIDEO (hover) ---------- */
        #previewVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            background: #000;
            border-radius: 0;
            z-index: 5;
            pointer-events: none;
        }

        /* ---------- PLAYER MODAL ---------- */
        .player-modal {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: modalFade 0.25s ease;
        }

        .player-modal.open {
            display: flex;
        }

        @keyframes modalFade {
            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .player-container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.9);
            aspect-ratio: 16 / 9;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .player-container video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            object-fit: contain;
            flex: 1;
            touch-action: none;
        }

        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 18px 14px;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.4) 70%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        /* ONLY show controls when JS class is present */
        .player-container.show-controls .player-controls {
            opacity: 1;
            pointer-events: auto;
        }

        /* Hide cursor in fullscreen when controls auto-hide */
        .player-container:fullscreen:not(.show-controls) {
            cursor: none;
        }

        .player-controls .controls-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .player-controls .controls-top .quality-selector {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
            transition: background 0.2s;
            backdrop-filter: blur(4px);
        }

        .player-controls .controls-top .quality-selector:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .player-controls .controls-top .quality-selector option {
            background: #222;
            color: #fff;
        }

        .player-controls .progress-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .player-controls .progress-wrap .time-display {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            min-width: 100px;
            letter-spacing: 0.02em;
            flex-shrink: 0;
        }

        .player-controls .progress-wrap .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: height 0.15s;
            min-height: 4px;
        }

        .player-controls .progress-wrap .progress-bar:hover {
            height: 6px;
        }

        .player-controls .progress-wrap .progress-bar .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.05s linear;
            position: relative;
        }

        .player-controls .progress-wrap .progress-bar .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -4px;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 0 12px rgba(248, 90, 62, 0.5);
        }

        .player-controls .progress-wrap .progress-bar:hover .progress-fill::after {
            opacity: 1;
        }

        .player-controls .controls-bottom {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .player-controls .controls-bottom .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, opacity 0.2s;
            opacity: 0.8;
            width: 32px;
            height: 32px;
            border-radius: 4px;
        }

        .player-controls .controls-bottom .ctrl-btn:hover {
            opacity: 1;
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.08);
        }

        .player-controls .controls-bottom .ctrl-btn:active {
            transform: scale(0.92);
        }

        .player-controls .controls-bottom .ctrl-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            stroke: none;
        }

        .player-controls .controls-bottom .ctrl-btn.volume-btn svg {
            width: 20px;
            height: 20px;
        }

        .player-controls .controls-bottom .ctrl-btn.fullscreen-btn svg {
            width: 20px;
            height: 20px;
        }

        .player-controls .controls-bottom .volume-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 1 120px;
        }

        .player-controls .controls-bottom .volume-wrap input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.25);
            outline: none;
            transition: background 0.2s;
            cursor: pointer;
        }

        .player-controls .controls-bottom .volume-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(248, 90, 62, 0.3);
        }

        .player-controls .controls-bottom .volume-wrap input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: none;
        }

        .player-controls .controls-bottom .spacer {
            flex: 1;
        }

        .player-close-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.6rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.15s;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.06);
        }

        .player-close-btn:active {
            transform: scale(0.92);
        }

        .skip-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            font-size: 3.2rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 60px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.2s ease;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 28px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .skip-indicator.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .skip-indicator.forward {
            color: #4fc3f7;
        }

        .skip-indicator.backward {
            color: #ff8a80;
        }

        .player-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .player-loading.show {
            opacity: 1;
        }

        .player-loading .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 768px) {
            .navbar {
                padding: 10px 16px;
                gap: 8px 12px;
            }

            .navbar-brand {
                font-size: 1.3rem;
            }

            .navbar-search {
                flex: 1 1 100%;
                min-width: 0;
            }

            .navbar-search input {
                padding: 8px 12px;
                font-size: 0.9rem;
            }

            .navbar-search button {
                padding: 8px 14px;
                font-size: 0.8rem;
            }

            .navbar-search button span {
                display: none;
            }

            .navbar-search button svg {
                width: 20px;
                height: 20px;
            }

            .main-container {
                padding: 12px 14px 0;
            }

            .hero-banner {
                width: 100%;
                aspect-ratio: 16 / 10;
                margin-bottom: 20px;
                max-height: 400px;
            }

            .hero-banner .hero-overlay {
                padding: 18px 20px 22px;
            }

            .hero-banner .hero-overlay .hero-title {
                font-size: clamp(1.1rem, 5vw, 1.8rem);
            }

            .hero-banner .hero-overlay .hero-meta {
                font-size: 0.8rem;
                gap: 10px;
            }

            .hero-banner .hero-overlay .hero-play-btn {
                padding: 10px 22px;
                font-size: 0.95rem;
            }

            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 14px;
            }

            .video-card .card-body {
                padding: 10px 12px 12px;
            }

            .video-card .card-body .card-title {
                font-size: 0.9rem;
            }

            .video-card .card-body .card-meta {
                font-size: 0.75rem;
                gap: 8px;
            }

            .player-container {
                max-height: 95vh;
                border-radius: 8px;
            }

            .player-controls {
                padding: 10px 12px 10px;
            }

            .player-controls .controls-bottom .ctrl-btn {
                width: 28px;
                height: 28px;
            }

            .player-controls .controls-bottom .ctrl-btn svg {
                width: 18px;

    <!-- ===== NAVBAR ===== -->
    <header class="navbar" role="banner">

        </div>

                    </svg>

            </div>
        </section>

        <h2 class="section-title" id="sectionTitle">VIDEOS YOU MAY LIKE</h2>
